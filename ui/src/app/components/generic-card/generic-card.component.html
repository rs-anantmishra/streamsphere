<div class="simplecard details" (click)="selectedGroup(this.group)">
    <p-card subheader="" styleClass="settings">
        <ng-template pTemplate="header">
            <!-- card-image -->
            <div class="zoom-img">
                <img [src]="group.thumbnail" class="center-cropped" />
            </div>
            <!-- duration -->
            <div class="tag-container">
                <p-tag icon="pi pi-list" severity="secondary" value="{{group.item_count}} videos" />
            </div>
            <!-- title and its tooltip -->
            <span class="header header-text" [pTooltip]="hdrtooltipContent" tooltipPosition="bottom"
                showDelay="500">{{group.title}}</span>
            <ng-template #hdrtooltipContent>
                <div class="tooltip-text">
                    <span> {{group.title}} </span>
                </div>
            </ng-template>
        </ng-template>

        <div class="content-section">
            <div style="display: flex;">
                <span class="channel-style">{{group.uploader}} </span><br />
            </div>
        </div>
    </p-card>
</div>
